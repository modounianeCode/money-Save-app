services:
  db:
    image: postgres:16-alpine
    container_name: money-save-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: moneysave
      POSTGRES_PASSWORD: moneysave
      POSTGRES_DB: moneysave
    ports:
      - "5432:5432"
    volumes:
      - moneysave-data:/var/lib/postgresql/data

volumes:
  moneysave-data: